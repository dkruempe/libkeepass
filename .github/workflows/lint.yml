name: Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest

    env:
      CONAN_VERSION: "2.31.2"
      # Pinned to the exact version used by the project maintainers; bump both
      # together with the locally installed toolchain.
      CLANG_FORMAT_VERSION: "22.1.8"
      CLANG_TIDY_VERSION: "22.1.8"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Conan
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}

      - name: Install clang-format and clang-tidy
        run: |
          pip install "clang-format==${{ env.CLANG_FORMAT_VERSION }}" \
                      "clang-tidy==${{ env.CLANG_TIDY_VERSION }}"

      - name: Restore Conan packages
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}
          install: "false"
          cache-mode: restore
          cache-suffix: "default"

      # Configure the Debug build only to generate compile_commands.json, which
      # run-clang-tidy needs to resolve the include paths and flags.
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=17

      # Save the cache immediately after dependency provisioning but before
      # any linting, so that a later failure does not lose the dependencies.
      - name: Save Conan packages
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}
          install: "false"
          cache-mode: save
          cache-suffix: "default"

      - name: Check formatting
        run: clang-format --dry-run --Werror $(git ls-files '*.cc' '*.hh')

      # -extra-arg silences "unknown warning option" hard errors for the
      # GCC-only -W* flags that CMake injects for the default GCC toolchain.
      - name: Run clang-tidy
        run: run-clang-tidy.py -p build -j $(nproc) -extra-arg=-Wno-unknown-warning-option src cli test

  windows-lint:
    runs-on: windows-latest

    env:
      CONAN_VERSION: "2.31.2"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Conan
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}

      - name: Install LLVM (clang-tidy)
        run: choco install llvm --yes --no-progress

      - name: Restore Conan packages
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}
          install: "false"
          cache-mode: restore
          cache-suffix: "windows-lint"

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=17

      - name: Save Conan packages
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}
          install: "false"
          cache-mode: save
          cache-suffix: "windows-lint"

      - name: Run clang-tidy
        shell: pwsh
        run: |
          $env:Path = "C:\Program Files\LLVM\bin;$env:Path"
          $script = Join-Path $env:RUNNER_TEMP "run-clang-tidy.py"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-22.1.8/clang-tools-extra/clang-tidy/tool/run-clang-tidy.py" `
            -OutFile $script
          python $script -p build -j $env:NUMBER_OF_PROCESSORS `
            -extra-arg=-Wno-unknown-warning-option src cli test