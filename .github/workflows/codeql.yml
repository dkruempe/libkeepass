name: CodeQL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      security-events: write
      actions: read

    env:
      CONAN_VERSION: "2.31.2"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      # The Conan provider (conan_provider.cmake) provisions all dependencies
      # from the conanfile during the first CMake configure, so install Conan
      # before initializing CodeQL and simply build the project afterwards.
      - name: Set up Conan
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}

      - name: Restore Conan packages
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}
          install: "false"
          cache-mode: restore
          cache-suffix: "default"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          queries: security-and-quality

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=17

      # Save the cache immediately after dependency provisioning but before
      # building the project, so that a later build failure does not lose the
      # fetched/built dependencies. Skip saving when the restore hit the exact
      # key, otherwise GitHub refuses to reserve the already-existing cache.
      - name: Save Conan packages
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}
          install: "false"
          cache-mode: save
          cache-suffix: "default"

      - name: Build
        run: cmake --build build -j $(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp"