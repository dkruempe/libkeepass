name: CMake

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ubuntu-build:
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]

    runs-on: ubuntu-latest

    env:
      CONAN_VERSION: "2.31.2"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Conan
        run: |
          pip install "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ matrix.build-type }}-conan-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.build-type }}-conan-${{ env.CONAN_VERSION }}-
            conan-${{ runner.os }}-

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_CXX_STANDARD=17

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} -j $(nproc)

      - name: Test
        working-directory: build
        run: ctest -C ${{ matrix.build-type }} --output-on-failure

  macos-build:
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]

    runs-on: macos-latest

    env:
      CONAN_VERSION: "2.31.2"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Conan
        run: |
          pip install "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ matrix.build-type }}-conan-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.build-type }}-conan-${{ env.CONAN_VERSION }}-
            conan-${{ runner.os }}-

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_CXX_STANDARD=17

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} -j $(sysctl -n hw.ncpu)

      - name: Test
        working-directory: build
        run: ctest -C ${{ matrix.build-type }} --output-on-failure

  windows-build:
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]

    runs-on: windows-latest

    env:
      CONAN_VERSION: "2.31.2"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Conan
        run: |
          pip install "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ matrix.build-type }}-conan-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.build-type }}-conan-${{ env.CONAN_VERSION }}-
            conan-${{ runner.os }}-

      # Windows builds are otherwise surprisingly sequential: OpenSSL is built
      # with nmake (no -j) and project-level /m parallelism is disabled by
      # default. Write a Conan global.conf that explicitly enables file-level
      # (/MP, tools.build:jobs) and project-level (/m, msbuild:max_cpu_count)
      # parallelism, using all available cores.
      - name: Configure Conan parallel builds
        shell: pwsh
        run: |
          $jobs = $env:NUMBER_OF_PROCESSORS
          $confDir = "$env:USERPROFILE\.conan2"
          New-Item -ItemType Directory -Force -Path $confDir | Out-Null
          @"
          tools.build:jobs=$jobs
          tools.microsoft.msbuild:max_cpu_count=0
          "@ | Set-Content -Path (Join-Path $confDir "global.conf") -Encoding ascii

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_CXX_STANDARD=17

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }}

      - name: Test
        working-directory: build
        run: ctest -C ${{ matrix.build-type }} --output-on-failure
