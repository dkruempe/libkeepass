name: CMake

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ubuntu-build:
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]

    runs-on: ubuntu-latest

    env:
      CONAN_VERSION: "2.31.2"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Conan
        run: |
          pip install "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force

      - name: Cache Conan packages (restore)
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ matrix.build-type }}-conan-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.build-type }}-conan-${{ env.CONAN_VERSION }}-
            conan-${{ runner.os }}-

      - name: Install lcov
        if: matrix.build-type == 'Debug'
        run: sudo apt-get install -y lcov

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_C_FLAGS=--coverage

      # Save the cache immediately after dependency provisioning but before
      # building the project, so that a later build failure does not lose the
      # fetched/built dependencies. The next run can then restore them.
      - name: Cache Conan packages (save before build)
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ matrix.build-type }}-conan-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.txt') }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} -j $(nproc)

      - name: Test
        if: matrix.build-type != 'Debug'
        working-directory: build
        run: ctest -C ${{ matrix.build-type }} --output-on-failure

      - name: Test with coverage
        if: matrix.build-type == 'Debug'
        working-directory: build
        run: |
          lcov --zerocounters --directory .
          ctest -C Debug --output-on-failure
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/test/*' '*/CMakeFiles/*' --output-file coverage.info --ignore-errors unused

      - name: Upload coverage to Codecov
        if: matrix.build-type == 'Debug'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  macos-build:
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]

    runs-on: macos-latest

    env:
      CONAN_VERSION: "2.31.2"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Conan
        run: |
          pip install "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force

      - name: Cache Conan packages (restore)
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ matrix.build-type }}-conan-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.build-type }}-conan-${{ env.CONAN_VERSION }}-
            conan-${{ runner.os }}-

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_CXX_STANDARD=17

      # Save the cache immediately after dependency provisioning but before
      # building the project, so that a later build failure does not lose the
      # fetched/built dependencies. The next run can then restore them.
      - name: Cache Conan packages (save before build)
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ matrix.build-type }}-conan-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.txt') }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} -j $(sysctl -n hw.ncpu)

      - name: Test
        working-directory: build
        run: ctest -C ${{ matrix.build-type }} --output-on-failure

  windows-build:
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]

    runs-on: windows-latest

    env:
      CONAN_VERSION: "2.31.2"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Conan
        run: |
          pip install "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force

      - name: Cache Conan packages (restore)
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ matrix.build-type }}-conan-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.build-type }}-conan-${{ env.CONAN_VERSION }}-
            conan-${{ runner.os }}-

      # Windows builds are otherwise surprisingly sequential: OpenSSL is built
      # with nmake (no -j) and project-level /m parallelism is disabled by
      # default. Write a Conan global.conf that explicitly enables file-level
      # (/MP, tools.build:jobs) and project-level (/m, msbuild:max_cpu_count)
      # parallelism, using all available cores.
      - name: Configure Conan parallel builds
        shell: pwsh
        run: |
          $jobs = $env:NUMBER_OF_PROCESSORS
          $confDir = "$env:USERPROFILE\.conan2"
          New-Item -ItemType Directory -Force -Path $confDir | Out-Null
          @"
          tools.build:jobs=$jobs
          tools.microsoft.msbuild:max_cpu_count=0
          "@ | Set-Content -Path (Join-Path $confDir "global.conf") -Encoding ascii

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_CXX_STANDARD=17

      # Save the cache immediately after dependency provisioning but before
      # building the project, so that a later build failure does not lose the
      # fetched/built dependencies. The next run can then restore them.
      - name: Cache Conan packages (save before build)
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ matrix.build-type }}-conan-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.txt') }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }}

      - name: Test
        working-directory: build
        run: ctest -C ${{ matrix.build-type }} --output-on-failure
