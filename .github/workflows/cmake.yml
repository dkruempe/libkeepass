name: CMake

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ubuntu-build:
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]

    runs-on: ubuntu-latest

    env:
      CONAN_VERSION: "2.31.2"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Conan
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}

      - name: Restore Conan packages
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}
          install: "false"
          cache-mode: restore
          cache-suffix: "${{ matrix.build-type }}"

      - name: Install lcov
        if: matrix.build-type == 'Debug'
        run: sudo apt-get install -y lcov

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_C_FLAGS=--coverage

      # Save the cache immediately after dependency provisioning but before
      # building the project, so that a later build failure does not lose the
      # fetched/built dependencies. The next run can then restore them.
      - name: Save Conan packages
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}
          install: "false"
          cache-mode: save
          cache-suffix: "${{ matrix.build-type }}"

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} -j $(nproc)

      - name: Check exported ABI symbols
        if: matrix.build-type == 'Release'
        run: tools/check_symbols.sh build

      # Round-trip benchmark: export and import timings plus peak RSS. The
      # absolute threshold is deliberately generous for shared CI runners
      # (which are also built with coverage here); the export/import ratio is
      # hardware-independent and catches directional regressions.
      - name: Benchmark export and import
        if: matrix.build-type == 'Release'
        run: ./bin/benchmark --json > benchmark-current.json

      - name: Compare benchmark against baseline
        if: matrix.build-type == 'Release'
        run: |
          python3 tools/benchmark_compare.py \
            --baseline test/benchmark_baseline.json \
            --current benchmark-current.json \
            --threshold 5.0 \
            --ratio-threshold 0.5

      - name: Upload benchmark results
        if: matrix.build-type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-current.json

      - name: Test
        if: matrix.build-type != 'Debug'
        working-directory: build
        run: ctest -C ${{ matrix.build-type }} --output-on-failure

      - name: Test with coverage
        if: matrix.build-type == 'Debug'
        working-directory: build
        run: |
          lcov --zerocounters --directory .
          ctest -C Debug --output-on-failure
          # The concurrency test executes instrumented code from several
          # threads; non-atomic gcov counters can produce negative deltas.
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch,negative
          lcov --remove coverage.info '/usr/*' '*/test/*' '*/CMakeFiles/*' --output-file coverage.info --ignore-errors unused,negative

      - name: Upload coverage to Codecov
        if: matrix.build-type == 'Debug'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  macos-build:
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]

    runs-on: macos-latest

    env:
      CONAN_VERSION: "2.31.2"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Conan
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}

      - name: Restore Conan packages
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}
          install: "false"
          cache-mode: restore
          cache-suffix: "${{ matrix.build-type }}"

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_CXX_STANDARD=17

      # Save the cache immediately after dependency provisioning but before
      # building the project, so that a later build failure does not lose the
      # fetched/built dependencies. The next run can then restore them.
      - name: Save Conan packages
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}
          install: "false"
          cache-mode: save
          cache-suffix: "${{ matrix.build-type }}"

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} -j $(sysctl -n hw.ncpu)

      - name: Test
        working-directory: build
        run: ctest -C ${{ matrix.build-type }} --output-on-failure

  windows-build:
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]

    runs-on: windows-latest

    env:
      CONAN_VERSION: "2.31.2"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Conan
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}

      - name: Restore Conan packages
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}
          install: "false"
          cache-mode: restore
          cache-suffix: "${{ matrix.build-type }}"

      # Windows builds are otherwise surprisingly sequential: OpenSSL is built
      # with nmake (no -j) and project-level /m parallelism is disabled by
      # default. Write a Conan global.conf that explicitly enables file-level
      # (/MP, tools.build:jobs) and project-level (/m, msbuild:max_cpu_count)
      # parallelism, using all available cores.
      - name: Configure Conan parallel builds
        shell: pwsh
        run: |
          $jobs = $env:NUMBER_OF_PROCESSORS
          $confDir = "$env:USERPROFILE\.conan2"
          New-Item -ItemType Directory -Force -Path $confDir | Out-Null
          @"
          tools.build:jobs=$jobs
          tools.microsoft.msbuild:max_cpu_count=0
          "@ | Set-Content -Path (Join-Path $confDir "global.conf") -Encoding ascii

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_CXX_STANDARD=17

      # Save the cache immediately after dependency provisioning but before
      # building the project, so that a later build failure does not lose the
      # fetched/built dependencies. The next run can then restore them.
      - name: Save Conan packages
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}
          install: "false"
          cache-mode: save
          cache-suffix: "${{ matrix.build-type }}"

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }}

      - name: Test
        working-directory: build
        run: ctest -C ${{ matrix.build-type }} --output-on-failure
