name: Fuzz

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  fuzz:
    name: fuzz-${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_kdbx, fuzz_kdb, fuzz_keyfile, fuzz_xml, fuzz_export]

    env:
      CONAN_VERSION: "2.31.2"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Clang (libFuzzer)
        run: |
          # Avoid an unbounded apt mirror stall on shared runners.
          timeout 300 sudo apt-get -o Acquire::Retries=3 update
          timeout 300 sudo apt-get install -y clang-18

      - name: Set up Conan
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}

      - name: Restore Conan packages
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}
          install: "false"
          cache-mode: restore
          cache-suffix: "fuzz"

      - name: Configure CMake (fuzzing)
        run: |
          cmake -B build-fuzz \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_C_STANDARD=11 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DLIBKEEPASS_BUILD_C_API=OFF \
            -DLIBKEEPASS_BUILD_FUZZING=ON

      - name: Save Conan packages
        uses: ./.github/actions/setup-conan
        with:
          conan-version: ${{ env.CONAN_VERSION }}
          install: "false"
          cache-mode: save
          cache-suffix: "fuzz"

      - name: Build ${{ matrix.target }}
        run: cmake --build build-fuzz --target ${{ matrix.target }} -- -j $(nproc)

      - name: Create seed corpus
        run: |
          mkdir -p seed-${{ matrix.target }}
          case "${{ matrix.target }}" in
            fuzz_kdbx)
              cp test/data/kdbx4/*.kdbx seed-${{ matrix.target }}/ 2>/dev/null || true
              cp test/data/kdbx/*.kdbx seed-${{ matrix.target }}/ 2>/dev/null || true
              ;;
            fuzz_kdb)
              cp test/data/kdb/*.kdb seed-${{ matrix.target }}/ 2>/dev/null || true
              ;;
            fuzz_keyfile)
              cp test/data/*.key seed-${{ matrix.target }}/ 2>/dev/null || true
              cp test/data/kdbx4/*.key seed-${{ matrix.target }}/ 2>/dev/null || true
              printf '000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f' \
                > seed-${{ matrix.target }}/hex.key
              printf '%s' '<?xml version="1.0"?><KeyFile><Key><Data>AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=</Data></Key></KeyFile>' \
                > seed-${{ matrix.target }}/xml.key
              ;;
            fuzz_xml)
              printf '%s' '<?xml version="1.0"?><KeePassFile><Meta><Generator>fuzz</Generator></Meta><Root><Group><UUID>AAAAAAAAAAAAAAAAAAAAAA==</UUID><Name>Root</Name><Entry><UUID>AQEBAQEBAQEBAQEBAQEBAQ==</UUID><String><Key>Title</Key><Value>seed</Value></String></Entry></Group></Root></KeePassFile>' \
                > seed-${{ matrix.target }}/seed.xml
              ;;
            *)
              ;;
          esac

      - name: Run ${{ matrix.target }} (60s)
        run: |
          timeout 120 \
            ./bin/${{ matrix.target }} \
              -detect_leaks=0 \
              -max_total_time=60 \
              -rss_limit_mb=4096 \
              -timeout=5 \
              seed-${{ matrix.target }} || exit_code=$?
          # Exit code 0 = no issues found
          # Exit code 1 = crash found
          # Exit code 77 = timeout (expected)
          if [ "${exit_code:-0}" -eq 1 ]; then
            echo "Fuzzer found a crash!"
            exit 1
          fi
          echo "Fuzzing completed without crashes."
