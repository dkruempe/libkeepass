name: Release

on:
  push:
    tags: [ 'v*' ]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-latest

    env:
      CONAN_VERSION: "2.31.2"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Conan
        run: |
          pip install "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force

      # CPack builds the RPM package with rpmbuild, which is not installed on
      # the default Ubuntu runner image.
      - name: Install RPM packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Cache Conan packages (restore)
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-conan-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-release-conan-${{ env.CONAN_VERSION }}-
            conan-${{ runner.os }}-

      - name: Configure CMake (Release)
        run: cmake -B build-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17

      - name: Configure CMake (Debug)
        run: cmake -B build-debug -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=17

      # Save the cache immediately after dependency provisioning but before
      # building the project, so that a later build failure does not lose the
      # fetched/built dependencies. The next run can then restore them.
      - name: Cache Conan packages (save before build)
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-conan-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.py') }}

      - name: Build (Release)
        run: cmake --build build-release -j $(nproc)

      - name: Build (Debug)
        run: cmake --build build-debug -j $(nproc)

      - name: Test (Release)
        working-directory: build-release
        run: ctest --output-on-failure

      # Prove the packaged library is consumable: the recipe builds libkeepass
      # from conanfile.py and runs the test_package consumer (constructs a
      # Database and links against the installed package).
      - name: Verify Conan recipe
        run: |
          conan create . --build=missing
          echo "Conan recipe libkeepass/$(sed -n 's/.*VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n1) built and consumed by test_package"

      - name: Package (CPack)
        working-directory: build-release
        run: cpack

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: build-release/packages/*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    env:
      CONAN_VERSION: "2.31.2"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Conan
        run: |
          pip install "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force

      - name: Cache Conan packages (restore)
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-conan-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-release-conan-${{ env.CONAN_VERSION }}-
            conan-${{ runner.os }}-

      - name: Configure CMake
        run: cmake -B build-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17

      # Save the cache immediately after dependency provisioning but before
      # building the project, so that a later build failure does not lose the
      # fetched/built dependencies. The next run can then restore them.
      - name: Cache Conan packages (save before build)
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-conan-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.py') }}

      - name: Build
        run: cmake --build build-release -j $(sysctl -n hw.ncpu)

      - name: Test
        working-directory: build-release
        run: ctest --output-on-failure

      - name: Package (CPack)
        working-directory: build-release
        run: cpack

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: build-release/packages/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    env:
      CONAN_VERSION: "2.31.2"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Conan
        run: |
          pip install "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force

      - name: Cache Conan packages (restore)
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-conan-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-release-conan-${{ env.CONAN_VERSION }}-
            conan-${{ runner.os }}-

      # Windows builds are otherwise surprisingly sequential: OpenSSL is built
      # with nmake (no -j) and project-level /m parallelism is disabled by
      # default. Write a Conan global.conf that explicitly enables file-level
      # (/MP, tools.build:jobs) and project-level (/m, msbuild:max_cpu_count)
      # parallelism, using all available cores.
      - name: Configure Conan parallel builds
        shell: pwsh
        run: |
          $jobs = $env:NUMBER_OF_PROCESSORS
          $confDir = "$env:USERPROFILE\.conan2"
          New-Item -ItemType Directory -Force -Path $confDir | Out-Null
          @"
          tools.build:jobs=$jobs
          tools.microsoft.msbuild:max_cpu_count=0
          "@ | Set-Content -Path (Join-Path $confDir "global.conf") -Encoding ascii

      - name: Configure CMake
        run: cmake -B build-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17

      # Save the cache immediately after dependency provisioning but before
      # building the project, so that a later build failure does not lose the
      # fetched/built dependencies. The next run can then restore them.
      - name: Cache Conan packages (save before build)
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-release-conan-${{ env.CONAN_VERSION }}-${{ hashFiles('conanfile.py') }}

      - name: Build
        run: cmake --build build-release --config Release

      - name: Test
        working-directory: build-release
        run: ctest -C Release --output-on-failure

      - name: Package (CPack)
        working-directory: build-release
        run: cpack -C Release

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: build-release/packages/*
          if-no-files-found: error

  create-release:
    needs: [ build-linux, build-macos, build-windows ]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true

      - name: Compute SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: List release assets
        working-directory: release-assets
        run: ls -la

      # Draft release so a human can inspect and publish it. The token above
      # (contents: write) is provided automatically; no extra secrets needed.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: true
          name: v${{ github.ref_name }}
          tag_name: v${{ github.ref_name }}
          fail_on_unmatched_files: true