name: Set up Conan
description: Install a pinned Conan version and create the default profile.

inputs:
  conan-version:
    description: Conan version to install.
    required: false
    default: "2.31.2"

runs:
  using: composite
  steps:
    - name: Install Conan
      shell: bash
      run: |
        python -m pip install "conan==${{ inputs.conan-version }}"
        conan profile detect --force
