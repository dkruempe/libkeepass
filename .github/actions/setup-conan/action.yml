name: Set up Conan
description: Install a pinned Conan version, create the default profile and optionally manage the Conan cache.

inputs:
  conan-version:
    description: Conan version to install.
    required: false
    default: "2.31.2"
  cache-mode:
    description: "restore, save, both or none (default: none)"
    required: false
    default: "none"
  cache-suffix:
    description: Extra cache-key segment to isolate build matrices.
    required: false
    default: "default"
  install:
    description: Install Conan and create the profile (false for cache-only saves).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Restore Conan cache
      if: inputs.cache-mode == 'restore' || inputs.cache-mode == 'both'
      uses: actions/cache/restore@v4
      with:
        path: ~/.conan2
        key: conan-${{ runner.os }}-${{ inputs.cache-suffix }}-conan-${{ inputs.conan-version }}-${{ hashFiles('conanfile.py') }}
        restore-keys: |
          conan-${{ runner.os }}-${{ inputs.cache-suffix }}-conan-${{ inputs.conan-version }}-
          conan-${{ runner.os }}-${{ inputs.cache-suffix }}-
          conan-${{ runner.os }}-

    - name: Install Conan
      if: inputs.install == 'true'
      shell: bash
      run: |
        python -m pip install "conan==${{ inputs.conan-version }}"
        conan profile detect --force

    - name: Save Conan cache
      if: inputs.cache-mode == 'save' || inputs.cache-mode == 'both'
      uses: actions/cache/save@v4
      with:
        path: ~/.conan2
        key: conan-${{ runner.os }}-${{ inputs.cache-suffix }}-conan-${{ inputs.conan-version }}-${{ hashFiles('conanfile.py') }}
