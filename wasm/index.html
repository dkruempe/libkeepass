<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>libkeepass WASM demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 3rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 14rem; font-family: ui-monospace, monospace; }
    input[type=password] { width: 20rem; }
    .hint { color: #555; }
    #output { white-space: pre-wrap; background: #f6f6f6; padding: 1rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>libkeepass WASM demo</h1>
  <p class="hint">
    Decryption happens entirely in this browser tab. Pick a KDBX file, enter the
    master password and inspect the JSON model. Nothing is uploaded.
  </p>
  <p><input id="file" type="file" accept=".kdbx,.kdb"></p>
  <p><label>Master password <input id="password" type="password" autocomplete="off"></label></p>
  <p><button id="open">Open database</button></p>
  <pre id="output">No database opened yet.</pre>

  <script src="libkeepass-demo.js"></script>
  <script>
    const output = document.getElementById('output');
    let lastFile = null;

    document.getElementById('file').addEventListener('change', (event) => {
      lastFile = event.target.files[0] || null;
    });

    document.getElementById('open').addEventListener('click', async () => {
      if (!lastFile) {
        output.textContent = 'Choose a database file first.';
        return;
      }
      const bytes = new Uint8Array(await lastFile.arrayBuffer());
      const password = document.getElementById('password').value;
      const pointer = Module._malloc(bytes.length);
      Module.HEAPU8.set(bytes, pointer);
      const utf8 = Module.stringToNewUTF8(password);
      const resultPointer = Module.ccall('demo_open', 'number',
        ['number', 'number', 'number'], [pointer, bytes.length, utf8]);
      const result = Module.UTF8ToString(resultPointer);
      Module.ccall('demo_free', null, [], []);
      Module._free(pointer);
      Module._free(utf8);

      try {
        output.textContent = JSON.stringify(JSON.parse(result), null, 2);
      } catch (e) {
        output.textContent = result;
      }
    });
  </script>
</body>
</html>
